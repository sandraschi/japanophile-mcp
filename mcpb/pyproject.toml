[project]
name = "japanophile-mcp"
version = "0.3.1"
description = "Japanophile wiadomo - kanji/JLPT learning tools, Japanese culture knowledge box, travel and diary roadmap. First -phile repo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/japanophile_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "webapp", "mcpb", "docs", "assets"]

[tool.ruff.lint.per-file-ignores]
"src/japanophile_mcp/activity_log.py" = ["BLE001"]
"src/japanophile_mcp/services/apps_routes.py" = ["BLE001", "PLW1510", "S110", "S112", "ASYNC220"]
"src/japanophile_mcp/services/llm_engine.py" = ["BLE001", "PLW1510"]
"src/japanophile_mcp/services/llm_providers.py" = ["BLE001", "PLW1510", "SIM117"]
"src/japanophile_mcp/services/fleet_catalog.py" = ["BLE001"]
"src/japanophile_mcp/services/fleet_common.py" = ["BLE001"]
"src/japanophile_mcp/utils/gh_cli.py" = ["BLE001", "PLW1510"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
